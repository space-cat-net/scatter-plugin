[plugin]

name="Scatter3D"
description="Scatter meshes across surfaces using Poisson disk sampling. Multiple prototype types with per-instance radii, weighted distribution, normal/height/density filters, region modifiers, and baked data. Instances are spawned via RenderingServer and PhysicsServer - no per-instance nodes, so tens of thousands of objects stay cheap."
author="SpaceCat"
version="5.0.1"
script="plugin.gd"
